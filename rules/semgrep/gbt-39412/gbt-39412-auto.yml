          - pattern: int* $P = ($CAST) $VAL
          - pattern: void* $P = $VAL
    metadata:
      gb_standard: GB/T 39412-2020
      gb_clause: "7.5.1"

  # 7.5.2 利用指针减法确定内存大小
  - id: gbt-39412-7-5-2
    languages: ['c', 'cpp']
    severity: WARNING
    message: 【GB/T 39412-2020 7.5.2】利用指针减法确定内存大小
    patterns:
      - pattern-either:
          - pattern: ($PTR2 - $PTR1) * sizeof($TYPE)
          - pattern: sizeof($TYPE) * ($PTR2 - $PTR1)
    metadata:
      gb_standard: GB/T 39412-2020
      gb_clause: "7.5.2"

